[package]
name = "ruuvitag-listener"
description = "Print RuuviTag measurements in Telegraf compatible format"
version = "0.9.0"
license = "MIT"
authors = ["Ville Lautanala <lautis@gmail.com>"]
repository = "https://github.com/lautis/ruuvitag-listener"
keywords = ["ruuvi", "ruuvitag", "telegraf"]
edition = "2024"

[features]
default = ["bluer", "hci"]
bluer = ["dep:bluer", "dep:futures"]
hci = ["dep:libc", "tokio/net"]

[dependencies]
bluer = { version = "0.17", features = ["bluetoothd"], optional = true }
libc = { version = "0.2", optional = true }
ruuvi-sensor-protocol = "0.7.0"
tokio = { version = "1", features = ["rt", "macros", "sync", "signal"] }
tokio-util = { version = "0.7", default-features = false }
futures = { version = "0.3", optional = true }
clap = { version = "4", features = ["derive"] }
thiserror = "2"
jiff = { version = "0.2", default-features = false, features = ["std"] }

[dev-dependencies]
tokio-test = "0.4"
criterion = "0.8"
tokio = { version = "1", features = ["rt-multi-thread"] }

[[bench]]
name = "pipeline"
harness = false

[[bench]]
name = "formatter"
harness = false

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = "debuginfo"
